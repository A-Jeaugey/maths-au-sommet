# =============================================================================
#  Configuration de l'interface d'administration (Sveltia CMS)
# -----------------------------------------------------------------------------
#  Édition 100 % en ligne. Après connexion avec le compte GitHub du projet,
#  le bouton « Publier » enregistre et envoie automatiquement les changements
#  (commit + push) ; le site se reconstruit et se met à jour tout seul.
# =============================================================================

backend:
  name: github
  repo: lesmathsausommet/les-maths-au-sommet
  branch: main # branche publiée par l'hébergeur

  # Connexion GitHub gérée par le site lui-même (routes /api/auth et
  # /api/callback) : aucun service externe à déployer.
  base_url: https://les-maths-au-sommet.vercel.app
  auth_endpoint: api/auth

  # Filet de secours : permet aussi de se connecter en collant un « jeton
  # d'accès personnel » GitHub, si jamais la connexion classique pose souci.
  allow_token_auth: true

  # Messages enregistrés dans l'historique GitHub à chaque publication.
  commit_messages:
    create: 'Ajout : {{collection}} « {{slug}} »'
    update: 'Modification : {{collection}} « {{slug}} »'
    delete: 'Suppression : {{collection}} « {{slug}} »'
    uploadMedia: 'Ajout d''une image : {{path}}'
    deleteMedia: 'Suppression d''une image : {{path}}'

# Permet de tester l'admin en local sans connexion GitHub
# (commande : npx @sveltia/cms-server). Sans aucun effet en ligne.
local_backend: true

# Dossier où atterrissent les photos importées depuis l'admin.
media_folder: "public/photos"
public_folder: "/photos"

# Langue de l'interface.
locale: fr

# Message d'aide affiché en haut de l'éditeur.
site_url: "/"

collections:
  # ---------------------------------------------------------------------------
  #  RÉGLAGES DU SITE — informations globales (lien cagnotte, e-mail, dates…).
  # ---------------------------------------------------------------------------
  - name: settings
    label: "Réglages du site"
    description: "Les informations qui apparaissent un peu partout sur le site."
    editor:
      preview: false
    files:
      - name: general
        label: "Informations générales"
        file: "content/site.json"
        fields:
          - { name: hellloAssoUrl, label: "Lien de la cagnotte HelloAsso", widget: string, hint: "L'adresse exacte de la cagnotte. Collez le lien complet (https://…)." }
          - { name: contactEmail, label: "E-mail de contact", widget: string }
          - { name: schoolName, label: "Nom du lycée", widget: string }
          - { name: city, label: "Ville", widget: string }
          - { name: schoolYear, label: "Année scolaire", widget: string }
          - { name: studentsCount, label: "Nombre d'élèves", widget: number, value_type: int }
          - { name: summitName, label: "Nom du sommet", widget: string }
          - { name: summitAltitude, label: "Altitude du sommet (en mètres)", widget: number, value_type: int }
          - { name: expeditionDates, label: "Dates de l'expédition", widget: string }
          - { name: guideCompany, label: "Compagnie des guides", widget: string }
          - { name: guideCompanyFounded, label: "Année de création de la compagnie", widget: number, value_type: int }
          - { name: costPerStudent, label: "Coût par élève (en euros)", widget: number, value_type: int }

      - name: footer
        label: "Pied de page"
        file: "content/footer.json"
        fields:
          - name: columns
            label: "Colonnes de liens"
            label_singular: "Colonne"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Titre de la colonne", widget: string }
              - name: links
                label: "Liens"
                label_singular: "Lien"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "Texte", widget: string }
                  - { name: url, label: "Adresse (optionnel)", widget: string, required: false, hint: "Laissez vide pour du texte simple. Ex : #projet, mailto:…, https://…" }
          - { name: bottomNote, label: "Petite ligne en bas (optionnel)", widget: string, required: false }

  # ---------------------------------------------------------------------------
  #  PAGE D'ACCUEIL — contenu de la page principale (hors animations/3D).
  # ---------------------------------------------------------------------------
  - name: home
    label: "Page d'accueil"
    description: "Les listes affichées sur la page d'accueil. Le design et les animations restent inchangés."
    editor:
      preview: false
    files:
      - name: home
        label: "Contenu de la page d'accueil"
        file: "content/home.json"
        fields:
          - name: keyFigures
            label: "Chiffres-clés (compteurs animés)"
            label_singular: "Chiffre"
            widget: list
            summary: "{{fields.value}}{{fields.suffix}} — {{fields.label}}"
            fields:
              - { name: value, label: "Nombre", widget: number, value_type: int }
              - { name: suffix, label: "Unité (optionnel)", widget: string, required: false, hint: "Ex : « m », « jours »." }
              - { name: label, label: "Légende", widget: string }

          - name: timeline
            label: "Frise de l'année"
            label_singular: "Étape"
            widget: list
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { name: date, label: "Date", widget: string }
              - { name: title, label: "Titre", widget: string }
              - { name: body, label: "Description", widget: text }

          - name: team
            label: "Équipe encadrante"
            label_singular: "Encadrant"
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { name: name, label: "Nom", widget: string }
              - { name: role, label: "Fonction", widget: string }
              - { name: note, label: "Précision", widget: string }

          - name: partners
            label: "Partenaires"
            label_singular: "Partenaire"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Nom du partenaire", widget: string }
              - { name: note, label: "Précision", widget: string }

          - name: routeStages
            label: "Itinéraire (les 2 jours d'ascension)"
            label_singular: "Jour"
            widget: list
            summary: "{{fields.day}} — {{fields.title}}"
            fields:
              - { name: day, label: "Jour", widget: string }
              - { name: title, label: "Trajet", widget: string }
              - { name: altitude, label: "Altitude atteinte", widget: string }
              - { name: deniveleUp, label: "Dénivelé positif", widget: string }
              - { name: deniveleDown, label: "Dénivelé négatif", widget: string }
              - { name: note, label: "Description", widget: text }

          - name: gallery
            label: "Galerie photos de l'accueil"
            widget: object
            fields:
              - name: chapters
                label: "Chapitres de la galerie"
                label_singular: "Chapitre"
                widget: list
                summary: "{{fields.title}} {{fields.highlight}}"
                fields:
                  - { name: number, label: "Numéro (ex : I., II.)", widget: string }
                  - { name: title, label: "Titre du chapitre", widget: string }
                  - { name: highlight, label: "Fin du titre, en bleu (optionnel)", widget: string, required: false }
                  - { name: meta, label: "Lieu / date du chapitre (optionnel)", widget: string, required: false }
                  - name: photos
                    label: "Photos du chapitre"
                    label_singular: "Photo"
                    widget: list
                    summary: "{{fields.caption}}"
                    fields:
                      - { name: src, label: "Photo", widget: image }
                      - { name: caption, label: "Légende (optionnel)", widget: string, required: false }
                      - { name: meta, label: "Lieu / date (optionnel)", widget: string, required: false }

  # ---------------------------------------------------------------------------
  #  PAGES — l'usine à pages. Créer/modifier des pages faites de blocs.
  # ---------------------------------------------------------------------------
  - name: pages
    label: "Pages du site"
    label_singular: "Page"
    description: >-
      Créez de nouvelles pages (par exemple une tombola, un compte rendu de
      sortie…) ou modifiez celles qui existent. Une page est une pile de
      « blocs » : ajoutez-les, réorganisez-les, remplissez-les. Le style et les
      animations sont appliqués automatiquement.
    folder: "content/pages"
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}}  ·  /{{fields.slug}}"
    fields:
      - name: title
        label: "Titre de la page"
        widget: string

      - name: slug
        label: "Adresse de la page (URL)"
        widget: string
        hint: >-
          Ce qui apparaît après le « / » dans l'adresse. Exemple : « tombola »
          donne votre-site.fr/tombola. Minuscules, chiffres et tirets
          uniquement, sans espace ni accent. À choisir une fois pour toutes.
        pattern:
          - "^[a-z0-9-]+$"
          - "Minuscules, chiffres et tirets uniquement (ex : tombola, fete-2026)"

      - name: description
        label: "Phrase de présentation"
        widget: text
        required: false
        hint: "Affichée sous le grand titre, et utilisée comme description pour les moteurs de recherche / partages."

      - name: ogImage
        label: "Image de partage (réseaux sociaux)"
        widget: image
        required: false
        hint: "Image affichée quand la page est partagée (Facebook, WhatsApp…). Optionnel."

      - name: theme
        label: "Ambiance de la page"
        widget: select
        default: "light"
        options:
          - { label: "Claire (fond blanc)", value: "light" }
          - { label: "Sombre (fond bleu nuit)", value: "dark" }

      - name: blocks
        label: "Blocs de la page"
        label_singular: "Bloc"
        widget: list
        hint: "Cliquez sur « Ajouter » pour empiler un bloc, puis glissez pour réorganiser."
        types:
          # ---- Titre de section ----
          - name: sectionHeader
            label: "Titre de section"
            widget: object
            summary: "Titre : {{fields.title}}"
            fields:
              - { name: label, label: "Petit texte au-dessus (optionnel)", widget: string, required: false, hint: "Affiché en petites majuscules, ex : « Action de financement »." }
              - { name: title, label: "Grand titre", widget: string }
              - { name: highlight, label: "Mot mis en valeur (optionnel)", widget: string, required: false, hint: "Ajouté à la suite du titre, en bleu et en italique." }
              - { name: intro, label: "Paragraphe d'introduction (optionnel)", widget: text, required: false }
              - { name: width, label: "Largeur du bloc (optionnel)", widget: select, required: false, default: "normal", options: [{ label: "Normale", value: "normal" }, { label: "Étroite", value: "narrow" }, { label: "Large", value: "wide" }, { label: "Pleine largeur", value: "full" }] }
              - { name: align, label: "Alignement du texte (optionnel)", widget: select, required: false, default: "left", options: [{ label: "À gauche", value: "left" }, { label: "Centré", value: "center" }] }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Texte ----
          - name: richText
            label: "Texte"
            widget: object
            summary: "Texte : {{fields.title}}"
            fields:
              - { name: title, label: "Titre (optionnel)", widget: string, required: false }
              - { name: body, label: "Texte", widget: markdown, hint: "Gras, italique, barré, listes, liens et images possibles via la barre d'outils." }
              - { name: width, label: "Largeur du bloc (optionnel)", widget: select, required: false, default: "normal", options: [{ label: "Normale", value: "normal" }, { label: "Étroite", value: "narrow" }, { label: "Large", value: "wide" }, { label: "Pleine largeur", value: "full" }] }
              - { name: align, label: "Alignement du texte (optionnel)", widget: select, required: false, default: "left", options: [{ label: "À gauche", value: "left" }, { label: "Centré", value: "center" }] }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Grille de cases ----
          - name: cardGrid
            label: "Grille de cases"
            widget: object
            summary: "Cases : {{fields.title}}"
            fields:
              - { name: title, label: "Titre (optionnel)", widget: string, required: false }
              - name: columns
                label: "Nombre de colonnes"
                widget: select
                default: 3
                options:
                  - { label: "2 colonnes", value: 2 }
                  - { label: "3 colonnes", value: 3 }
                  - { label: "4 colonnes", value: 4 }
              - name: cards
                label: "Cases"
                label_singular: "Case"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: icon, label: "Emoji (optionnel)", widget: string, required: false, hint: "Ex : 🎟️ 🏔️ 🧀" }
                  - { name: title, label: "Titre de la case", widget: string }
                  - { name: text, label: "Texte (optionnel)", widget: text, required: false }
                  - { name: linkLabel, label: "Texte du lien (optionnel)", widget: string, required: false }
                  - { name: linkUrl, label: "Adresse du lien (optionnel)", widget: string, required: false }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Galerie photos ----
          - name: gallery
            label: "Galerie photos"
            widget: object
            summary: "Galerie : {{fields.title}}"
            fields:
              - { name: title, label: "Titre (optionnel)", widget: string, required: false }
              - name: images
                label: "Photos"
                label_singular: "Photo"
                widget: list
                summary: "{{fields.caption}}"
                fields:
                  - { name: image, label: "Photo", widget: image }
                  - { name: caption, label: "Légende (optionnel)", widget: string, required: false }
                  - { name: meta, label: "Lieu / date (optionnel)", widget: string, required: false }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Gros chiffres ----
          - name: keyFigures
            label: "Gros chiffres animés"
            widget: object
            summary: "Chiffres-clés"
            fields:
              - name: figures
                label: "Chiffres"
                label_singular: "Chiffre"
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { name: value, label: "Nombre", widget: number, value_type: int }
                  - { name: suffix, label: "Unité (optionnel)", widget: string, required: false, hint: "Ex : « € », « m », « lots »." }
                  - { name: label, label: "Légende", widget: string }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Frise / étapes ----
          - name: timeline
            label: "Frise / étapes"
            widget: object
            summary: "Frise / étapes"
            fields:
              - name: steps
                label: "Étapes"
                label_singular: "Étape"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: date, label: "Date ou n° d'étape (optionnel)", widget: string, required: false }
                  - { name: title, label: "Titre de l'étape", widget: string }
                  - { name: body, label: "Description (optionnel)", widget: text, required: false }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Bouton d'action ----
          - name: cta
            label: "Bouton d'action"
            widget: object
            summary: "Bouton : {{fields.title}}"
            fields:
              - { name: title, label: "Titre", widget: string }
              - { name: text, label: "Texte (optionnel)", widget: text, required: false }
              - { name: buttonLabel, label: "Texte du bouton", widget: string }
              - { name: buttonUrl, label: "Adresse du bouton", widget: string, hint: "Ex : le lien HelloAsso, ou mailto:adresse@exemple.fr" }
              - { name: secondaryLabel, label: "Second lien — texte (optionnel)", widget: string, required: false }
              - { name: secondaryUrl, label: "Second lien — adresse (optionnel)", widget: string, required: false }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Image + texte ----
          - name: imageText
            label: "Image + texte"
            widget: object
            summary: "Image + texte : {{fields.title}}"
            fields:
              - { name: image, label: "Photo", widget: image }
              - name: imageSide
                label: "Position de la photo"
                widget: select
                default: "left"
                options:
                  - { label: "À gauche", value: "left" }
                  - { label: "À droite", value: "right" }
              - { name: title, label: "Titre (optionnel)", widget: string, required: false }
              - { name: body, label: "Texte", widget: markdown }
              - { name: caption, label: "Légende sous la photo (optionnel)", widget: string, required: false }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Citation ----
          - name: quote
            label: "Citation"
            widget: object
            summary: "« {{fields.quote}} »"
            fields:
              - { name: quote, label: "Citation", widget: text }
              - { name: author, label: "Auteur (optionnel)", widget: string, required: false }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Jauge de cagnotte ----
          - name: fundraiser
            label: "Jauge de cagnotte"
            widget: object
            summary: "Cagnotte : {{fields.current}} / {{fields.goal}}"
            fields:
              - { name: current, label: "Montant déjà collecté", widget: number, value_type: int }
              - { name: goal, label: "Objectif à atteindre", widget: number, value_type: int }
              - { name: currency, label: "Symbole monétaire", widget: string, default: "€", required: false }
              - { name: label, label: "Phrase sous la jauge (optionnel)", widget: text, required: false }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Compte à rebours ----
          - name: countdown
            label: "Compte à rebours"
            widget: object
            summary: "Compte à rebours : {{fields.label}}"
            fields:
              - { name: date, label: "Date cible", widget: datetime, format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm", hint: "Le compte à rebours s'arrête à cette date et heure." }
              - { name: label, label: "Titre au-dessus (optionnel)", widget: string, required: false, hint: "Ex : « Départ pour Chamonix dans… »" }
              - { name: expiredText, label: "Texte une fois la date atteinte (optionnel)", widget: string, required: false }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Contenu intégré (HelloAsso, formulaire, carte...) ----
          - name: embed
            label: "Contenu intégré (HelloAsso, formulaire…)"
            widget: object
            summary: "Intégration : {{fields.title}}"
            fields:
              - { name: url, label: "Adresse à intégrer (URL d'intégration)", widget: string, hint: "Ex : l'URL « widget / iframe » de votre formulaire HelloAsso." }
              - { name: title, label: "Titre au-dessus (optionnel)", widget: string, required: false }
              - { name: height, label: "Hauteur (en pixels)", widget: number, value_type: int, default: 700, required: false }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Vidéo ----
          - name: video
            label: "Vidéo (YouTube / Vimeo)"
            widget: object
            summary: "Vidéo : {{fields.title}}"
            fields:
              - { name: url, label: "Lien de la vidéo", widget: string, hint: "Collez le lien YouTube ou Vimeo (la barre d'adresse suffit)." }
              - { name: title, label: "Titre au-dessus (optionnel)", widget: string, required: false }
              - { name: caption, label: "Légende sous la vidéo (optionnel)", widget: string, required: false }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- FAQ / accordéon ----
          - name: accordion
            label: "FAQ / questions dépliables"
            widget: object
            summary: "FAQ : {{fields.title}}"
            fields:
              - { name: title, label: "Titre (optionnel)", widget: string, required: false }
              - name: items
                label: "Questions"
                label_singular: "Question"
                widget: list
                summary: "{{fields.question}}"
                fields:
                  - { name: question, label: "Question", widget: string }
                  - { name: answer, label: "Réponse", widget: markdown }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Tableau ----
          - name: table
            label: "Tableau"
            widget: object
            summary: "Tableau : {{fields.title}}"
            fields:
              - { name: title, label: "Titre (optionnel)", widget: string, required: false }
              - { name: headers, label: "En-têtes de colonnes (optionnel)", widget: list, required: false, field: { name: cell, label: "Colonne", widget: string } }
              - name: rows
                label: "Lignes"
                label_singular: "Ligne"
                widget: list
                fields:
                  - { name: cells, label: "Cellules (une par colonne)", widget: list, field: { name: cell, label: "Cellule", widget: string } }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Document à télécharger ----
          - name: file
            label: "Document à télécharger (PDF…)"
            widget: object
            summary: "Document : {{fields.title}}"
            fields:
              - { name: title, label: "Titre du document", widget: string, required: false }
              - { name: file, label: "Fichier", widget: file }
              - { name: description, label: "Description (optionnel)", widget: text, required: false }
              - { name: buttonLabel, label: "Texte du bouton (optionnel)", widget: string, required: false, default: "Télécharger" }
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Boutons ----
          - name: buttons
            label: "Boutons"
            widget: object
            summary: "Boutons"
            fields:
              - name: align
                label: "Alignement"
                widget: select
                default: "left"
                options: [{ label: "À gauche", value: "left" }, { label: "Centré", value: "center" }]
              - name: buttons
                label: "Boutons"
                label_singular: "Bouton"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "Texte du bouton", widget: string }
                  - { name: url, label: "Adresse / lien", widget: string }
                  - name: style
                    label: "Style"
                    widget: select
                    default: "primary"
                    options: [{ label: "Plein (jaune)", value: "primary" }, { label: "Contour", value: "secondary" }]
              - { name: background, label: "Fond de ce bloc (optionnel)", widget: select, required: false, default: "inherit", options: [{ label: "Hérité de la page", value: "inherit" }, { label: "Clair", value: "light" }, { label: "Sombre (bleu nuit)", value: "dark" }, { label: "Accent (jaune)", value: "accent" }, { label: "Clair + reliefs", value: "light-lines" }, { label: "Sombre + reliefs", value: "dark-lines" }, { label: "Montagnes", value: "mountain" }] }

          # ---- Bannière (image de fond) ----
          - name: banner
            label: "Bannière (image de fond)"
            widget: object
            summary: "Bannière : {{fields.title}}"
            fields:
              - { name: image, label: "Image de fond", widget: image }
              - { name: title, label: "Titre (optionnel)", widget: string, required: false }
              - { name: text, label: "Texte (optionnel)", widget: text, required: false }
              - { name: buttonLabel, label: "Texte du bouton (optionnel)", widget: string, required: false }
              - { name: buttonUrl, label: "Lien du bouton (optionnel)", widget: string, required: false }
              - { name: height, label: "Hauteur", widget: select, default: "medium", options: [{ label: "Petite", value: "small" }, { label: "Moyenne", value: "medium" }, { label: "Grande", value: "large" }] }
              - { name: align, label: "Position du texte", widget: select, default: "center", options: [{ label: "Centré", value: "center" }, { label: "En bas à gauche", value: "left" }] }

          # ---- Séparateur / espace ----
          - name: separator
            label: "Séparateur / espace"
            widget: object
            summary: "Séparateur"
            fields:
              - { name: style, label: "Type", widget: select, default: "line", options: [{ label: "Trait fin", value: "line" }, { label: "Espace vide", value: "space" }] }
              - { name: size, label: "Taille", widget: select, default: "medium", options: [{ label: "Petite", value: "small" }, { label: "Moyenne", value: "medium" }, { label: "Grande", value: "large" }] }
