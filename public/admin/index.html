<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Administration — Les Maths au Sommet</title>
    <!-- Chemin ABSOLU de la config : évite l'erreur « Failed to load config.yml (404) »
         quand /admin est ouvert sans slash final (Decap chercherait /config.yml). -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!--
      Interface d'édition du site (Decap CMS), chargée depuis Internet :
      il n'y a rien à installer.

      • Tout se fait EN LIGNE, depuis n'importe quel navigateur, à l'adresse
        votre-site.fr/admin
      • On se connecte avec le compte GitHub du projet.
      • Le bouton « Publier » enregistre les modifications et les envoie
        automatiquement sur GitHub (commit + push) : le site se met à jour
        tout seul en une à deux minutes. Aucun code, aucun terminal.
      • Pour les pages, un APERÇU EN DIRECT s'affiche à droite et se met à
        jour pendant que l'on tape (voir preview.js).
    -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/preview.js"></script>
  </body>
</html>
